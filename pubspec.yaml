name: hustle_link
description: HustleLink - Connect people with local gigs and opportunities.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.8.1

  # State management
  provider: ^6.1.2

  # Typography
  google_fonts: ^6.2.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  cloud_firestore: ^7.1.0
  supabase_flutter: ^2.15.4
  image_picker: ^1.2.1
  video_player: ^2.10.1
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
