name: Build Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hustlelink-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Commit refreshed dependency lockfile
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "Update Flutter dependency lockfile"
            git push
          fi

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hustlelink-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
