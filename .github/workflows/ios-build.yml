name: Build iOS Simulator App

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustlelink-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Generate iOS platform scaffold
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.hustlelink --project-name hustle_link .
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --debug --no-codesign --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hustlelink-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 7
